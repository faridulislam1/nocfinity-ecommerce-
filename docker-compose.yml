services:
  mysql:
    image: mysql:8.4
    container_name: nocfinity-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nocfinity_ecommerce
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - nocfinity_db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nocfinity-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_DATABASE: nocfinity_ecommerce
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nocfinity-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  nocfinity_db_data:

